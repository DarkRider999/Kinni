name: NocternalPlayz
options:
  bundleIdPrefix: com.nocternal
  deploymentTarget:
    iOS: "17.0"
packages:
  NocternalKit:
    path: NocternalKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NocternalPlayz:
    type: application
    platform: iOS
    sources: [NocternalPlayz]
    dependencies:
      - package: NocternalKit
        products: [NocternalKit]
      - sdk: ShazamKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nocternal.playz
        PRODUCT_NAME: NocternalPlayz
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: NocternalPlayz/Info.plist
      properties:
        CFBundleDisplayName: Nocternal Play
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        NSAppleMusicUsageDescription: Nocternal Play shows and plays the songs in your music library.
        NSMicrophoneUsageDescription: The microphone is used for voice commands and to recognize songs playing nearby.
        NSSpeechRecognitionUsageDescription: Speech recognition turns your voice commands into actions.

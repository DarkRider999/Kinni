[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neonforge"
version = "0.1.0"
description = "NeonForge AI: API, job queue and media processing engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "redis>=5.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10.3",
  "imageio-ffmpeg>=0.5",
  "onnxruntime>=1.18",
  "mediapipe>=0.10.14",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.34"]
# GPU image only: enables Real-ESRGAN upscaling (weights fetched by scripts/fetch_models.py)
torch = ["torch>=2.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
neonforge-api = "neonforge.api.main:run"
neonforge-worker = "neonforge.worker.main:run"

[tool.setuptools.packages.find]
include = ["neonforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

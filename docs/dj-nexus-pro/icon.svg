<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="DJ Nexus Pro app icon: the Nexus Platter">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19F0FF"/>
      <stop offset="0.55" stop-color="#8A5CFF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#1A1530"/>
      <stop offset="1" stop-color="#07060D"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- platter ring -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#ring)" stroke-width="44" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="268" fill="none" stroke="#221E36" stroke-width="6"/>
  <!-- strobe dots on the platter edge -->
  <g fill="#EDEBFA" opacity="0.55">
    <circle cx="512" cy="216" r="7"/><circle cx="808" cy="512" r="7"/>
    <circle cx="512" cy="808" r="7"/><circle cx="216" cy="512" r="7"/>
  </g>
  <!-- waveform N -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M392 650 V374 L632 650 V374" stroke="#EDEBFA" stroke-width="40"/>
    <path d="M452 512 h16 M484 470 v84 M516 440 v144 M548 470 v84 M580 512 h16" stroke="#19F0FF" stroke-width="14" opacity="0.9"/>
  </g>
</svg>

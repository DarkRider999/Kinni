<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Princess Memory Book icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4C1F9"/>
      <stop offset="0.55" stop-color="#FF9ECB"/>
      <stop offset="1" stop-color="#FF7EB9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F6C453"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="214" r="150" fill="url(#glow)"/>

  <!-- open book -->
  <g transform="translate(256 300)">
    <path d="M -168 -20 Q -84 -58 0 -30 Q 84 -58 168 -20 L 168 92 Q 84 64 0 92 Q -84 64 -168 92 Z"
          fill="#FFFFFF" opacity="0.96"/>
    <path d="M 0 -30 Q 84 -58 168 -20 L 168 92 Q 84 64 0 92 Z" fill="#FFE3EF"/>
    <path d="M 0 -30 L 0 92" stroke="#9B5DE5" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <g stroke="#FF7EB9" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <line x1="-130" y1="4" x2="-30" y2="-12"/>
      <line x1="-130" y1="34" x2="-30" y2="18"/>
      <line x1="30" y1="-12" x2="130" y2="4"/>
      <line x1="30" y1="18" x2="130" y2="34"/>
    </g>
    <!-- heart on the page -->
    <path d="M 0 2 C -14 -20 -46 -8 -30 18 C -22 32 0 46 0 46 C 0 46 22 32 30 18 C 46 -8 14 -20 0 2 Z"
          fill="#FF5FA2"/>
  </g>

  <!-- crown -->
  <g transform="translate(256 150)">
    <path d="M -70 34 L -70 -10 L -38 18 L 0 -34 L 38 18 L 70 -10 L 70 34 Z" fill="url(#gold)"
          stroke="#E0A93C" stroke-width="3"/>
    <circle cx="-70" cy="-16" r="9" fill="#FF7EB9"/>
    <circle cx="0" cy="-40" r="10" fill="#FF5FA2"/>
    <circle cx="70" cy="-16" r="9" fill="#FF7EB9"/>
    <rect x="-70" y="32" width="140" height="10" rx="5" fill="#E0A93C"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF">
    <path d="M 110 120 l 6 16 l 16 6 l -16 6 l -6 16 l -6 -16 l -16 -6 l 16 -6 Z" opacity="0.9"/>
    <path d="M 404 150 l 5 13 l 13 5 l -13 5 l -5 13 l -5 -13 l -13 -5 l 13 -5 Z" opacity="0.85"/>
    <circle cx="150" cy="360" r="6" opacity="0.8"/>
    <circle cx="372" cy="372" r="7" opacity="0.8"/>
  </g>
</svg>

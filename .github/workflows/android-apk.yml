name: Build AI Face Studio APK

# Builds a real, installable debug APK on GitHub's runners (which have normal internet access,
# unlike the sandbox this repo is usually edited from) and publishes it to a stable release tag
# so there's always a working download link. See ai-face-studio/README.md.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/ai-face-studio-build-wbx9ya
    paths:
      - 'ai-face-studio/web/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-face-studio/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No separate Android SDK setup step: ubuntu-latest already ships one (cmdline-tools,
      # platform-tools, recent platforms/build-tools, licenses pre-accepted). Gradle fetches
      # whatever specific version it still needs from google() itself.

      - name: Install dependencies
        run: npm ci

      - name: Build static export + sync into the Android project
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: ai-face-studio/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ai-face-studio-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ai-face-studio-debug-apk
          path: ai-face-studio/web/ai-face-studio-debug.apk

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag -R "${GITHUB_REPOSITORY}" || true
          gh release create apk-latest ai-face-studio-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AI Face Studio - latest debug APK" \
            --notes "Auto-built from commit ${GITHUB_SHA}. Debug-signed (Android's default debug key) - fine for sideloading/testing, not a Play Store release. Enable \"Install unknown apps\" for your browser/file manager to install it." \
            --prerelease

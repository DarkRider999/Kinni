name: Nocternal Playz

on:
  push:
    paths:
      - "nocternal-playz/**"
      - ".github/workflows/nocternal-playz.yml"
  pull_request:
    paths:
      - "nocternal-playz/**"
      - ".github/workflows/nocternal-playz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (unit tests + debug APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nocternal-playz/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (shared Kotlin modules)
        run: ./gradlew --no-daemon :core:model:test :plugin_api:test :theme_manager:test :playlists:test :ai_assistant:test :auto_mix_engine:test :lyrics_engine:test :backup_manager:test :fx_engine:test :radio_hub:test
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nocternal-playz-debug-apk
          path: nocternal-playz/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (Swift package tests + app build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: nocternal-playz/ios
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests (shared modules)
        run: swift test --package-path NocternalKit
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app for the iOS Simulator
        run: |
          xcodebuild -project NocternalPlayz.xcodeproj -scheme NocternalPlayz \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200
          exit ${PIPESTATUS[0]}

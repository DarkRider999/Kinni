name: Smart Beginning

on:
  push:
    paths:
      - "smart-beginning/**"
      - ".github/workflows/smart-beginning.yml"
  pull_request:
    paths:
      - "smart-beginning/**"
      - ".github/workflows/smart-beginning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: smart-beginning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smart-beginning-debug-apk
          path: smart-beginning/app/build/outputs/apk/debug/*.apk

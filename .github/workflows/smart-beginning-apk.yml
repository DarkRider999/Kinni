name: Smart Beginning APK

# Builds the Smart Beginning debug APK on GitHub's runners (which have the
# Android SDK and unrestricted network) and uploads it as a downloadable
# artifact. Download: Actions tab → this run → "Artifacts" → smart-beginning-debug-apk.

on:
  push:
    branches: ["ccr-4127a149-8p7mcn", "main"]
    paths:
      - "app-smart-beginning/**"
      - ".github/workflows/smart-beginning-apk.yml"
  pull_request:
    paths:
      - "app-smart-beginning/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-smart-beginning
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-beginning-debug-apk
          path: app-smart-beginning/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Anjali CRM AI

# Analyzes, tests and builds the Anjali CRM AI Flutter app (anjali-crm/) and publishes the
# release APK as a downloadable artifact (Actions run -> Artifacts -> anjali-crm-ai-apk).
# The user guide's install steps point at this workflow and artifact name; keep them in sync.

on:
  push:
    branches: [main, "ccr-**"]
    paths:
      - "anjali-crm/**"
      - ".github/workflows/anjali-crm-ai.yml"
  pull_request:
    paths:
      - "anjali-crm/**"
      - ".github/workflows/anjali-crm-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: anjali-crm

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Provides $ANDROID_HOME + sdkmanager and accepts licenses. packages:'' skips the action's
      # default install of the obsolete `tools` package (see kinni-android.yml).
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Writes android/key.properties from secrets when all four are set. Partial secrets fail the
      # job rather than producing a build signed with an unexpected key.
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANJALI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANJALI_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANJALI_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANJALI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          present=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [ -n "${!v}" ] && present=$((present + 1))
          done
          if [ "$present" -eq 0 ]; then
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not set; the APK is signed with a throwaway debug key and will not install over a previous build. See anjali-crm/README.md."
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "::error::Only $present of 4 ANJALI_* signing secrets are set. Set all four or none."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties
          echo "mode=release" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: anjali-crm-ai-apk
          path: anjali-crm/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Anjali CRM AI APK"
            echo "- Artifact: \`anjali-crm-ai-apk\` (app-release.apk)"
            if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
              echo "- Signing: **release key** (installs over previous release-signed builds)"
            else
              echo "- Signing: **debug key** - set the ANJALI_* secrets for installable updates"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

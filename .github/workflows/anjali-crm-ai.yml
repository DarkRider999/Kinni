name: Anjali CRM AI

# Analyze, test and build an installable Android APK for anjali-crm-ai.
# Download the APK from the run's "Artifacts" section.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   ANJALI_KEYSTORE_BASE64   base64 of the release .jks (scripts/gen_keystore.sh)
#   ANJALI_KEYSTORE_PASSWORD keystore + key password
#   ANJALI_KEY_ALIAS         key alias (default: anjali)
#   ANJALI_FIREBASE_JSON     contents of config/firebase.json (cloud sync)
#   MAPS_API_KEY             Google Maps Android key
# Without the keystore secrets the APK is signed with a throwaway debug key:
# fine for installing and testing, not for the Play Store.

on:
  push:
    paths:
      - "anjali-crm-ai/**"
      - ".github/workflows/anjali-crm-ai.yml"
  pull_request:
    paths:
      - "anjali-crm-ai/**"
      - ".github/workflows/anjali-crm-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anjali-crm-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Analyze, test, build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: anjali-crm-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Release signing (when secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANJALI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANJALI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANJALI_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/anjali-release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=${KEY_ALIAS:-anjali}"
              echo "storeFile=../anjali-release.jks"
            } > android/key.properties
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::notice::No keystore secrets: APK is signed with a debug key (install/test only)."
            echo "SIGNING=debug-signed" >> "$GITHUB_ENV"
          fi

      - name: Firebase config (when secret is set)
        env:
          FIREBASE_JSON: ${{ secrets.ANJALI_FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            printf '%s' "$FIREBASE_JSON" > config/firebase.json
            echo "DEFINES=--dart-define-from-file=config/firebase.json" >> "$GITHUB_ENV"
          else
            echo "::notice::No Firebase secret: app runs offline-only (cloud sync shows 'not set up')."
            echo "DEFINES=" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          flutter build apk --release $DEFINES
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/anjali-crm-ai-${VERSION}-${SIGNING}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: anjali-crm-ai-apk
          path: anjali-crm-ai/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/anjali-release.jks android/key.properties config/firebase.json

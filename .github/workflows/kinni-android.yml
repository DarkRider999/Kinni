name: Kinni Android

# Builds an installable debug APK for the Kinni pregnancy-tracker app (root :app module)
# and publishes it as a downloadable artifact on each run (Actions run → Artifacts → kinni-debug-apk).
# The sandbox that authored this has no Android SDK; CI is the reproducible way to produce the APK.

on:
  push:
    branches: [main, "ccr-**"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/kinni-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/kinni-android.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Provides $ANDROID_HOME + sdkmanager and accepts licenses.
      # packages:'' disables the action's default install of the obsolete `tools`
      # package, which no longer exists and makes the step fail; we install exactly
      # what we need in the next step instead.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      # compileSdk 36 (Android 16) + build-tools are not always preinstalled on the runner.
      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # No Gradle wrapper jar is committed at the repo root, so pin Gradle here
      # (matches gradle/wrapper/gradle-wrapper.properties) instead of calling ./gradlew.
      # The app's debug signing config points at a repo-root debug.keystore that
      # is (correctly) gitignored, so generate the standard Android debug keystore
      # here with the alias/passwords the config expects (androiddebugkey / android).
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK (CI artifact, needs GitHub login to download)
        uses: actions/upload-artifact@v4
        with:
          name: kinni-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # On main (and manual runs), also publish the APK to a rolling "app-latest"
      # Release so it has a permanent, login-free public download URL that can be
      # shared with family:
      #   https://github.com/DarkRider999/Kinni/releases/download/app-latest/app-debug.apk
      - name: Publish APK to the app-latest release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Kinni debug APK (latest)
          body: "Latest Kinni debug APK, built automatically from the default branch. Debug build — enable 'Install unknown apps' to sideload."
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true

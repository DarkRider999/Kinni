name: Am I Late

on:
  push:
    paths:
      - "am-i-late-by-roshan/**"
      - ".github/workflows/am-i-late.yml"
  pull_request:
    paths:
      - "am-i-late-by-roshan/**"
      - ".github/workflows/am-i-late.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + tests on PostGIS)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: am_i_late_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: am-i-late-by-roshan/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: am-i-late-by-roshan/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/am_i_late_test
      - run: npm run build

  ai-service:
    name: AI service (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: am-i-late-by-roshan/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: am-i-late-by-roshan
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  flutter:
    name: Flutter (analyze + test + APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: am-i-late-by-roshan/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK (debug-signed, installable for testing)
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.AM_I_LATE_API_BASE_URL || 'http://10.0.2.2:3000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: am-i-late-apk
          path: am-i-late-by-roshan/flutter_app/build/app/outputs/flutter-apk/app-release.apk

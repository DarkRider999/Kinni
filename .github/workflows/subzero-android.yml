name: SubZero

on:
  push:
    paths:
      - "subzero/**"
      - ".github/workflows/subzero-android.yml"
  pull_request:
    paths:
      - "subzero/**"
      - ".github/workflows/subzero-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android (unit tests + debug APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: subzero/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Crypto unit tests (Double Ratchet round-trip)
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: subzero-debug-apk
          path: subzero/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
